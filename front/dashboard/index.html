<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pacientes</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <div class="header-marca">
            <img src="/mainIcon.svg" alt="Ícone Principal">
        </div>
        <nav class="header-nav">
            <a href="/dashboard" class="nav-link ativo">Dashboard</a>
            <span class="nav-sep"></span>
            <a href="/listinha" class="nav-link">Fila</a>
            <span class="nav-sep"></span>
            <a href="/exportar" class="nav-link">Exportar</a>
            <span class="nav-sep"></span>
            <a href="/solicitacoes" class="nav-link">Solicitações</a>
            <span class="nav-sep"></span>
            <a href="/notificacoes" class="nav-link">Notificações</a>
        </nav>
        <button class="btn-reiniciar" title="Novo upload" onclick="window.location.href='/upload'">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
        </button>
    </header>

    <main>
        <div class="graficoPizza">
            <div class="titulosGraficoPizza">
                <div>
                    <h2>Gravidades</h2>
                    <p>A1 A2 C D E</p>
                </div>
            </div>

            <div class="nomesGraficoPizza">
                <div class="canvas-container">
                    <canvas id="salesChart"></canvas>
                </div>
                <div id="chartLegendContainer" class="legenda-container">
                </div>
            </div>
        </div>

        <div class="secaoPacientes">
            <h2 class="titulo-pacientes">NÚMERO PACIENTES: <span id="totalPacientes">0</span></h2>
            <div id="listaBarrasPacientes" class="lista-barras"></div>
        </div>

        <div class="card-tempo">
            <h2 class="card-titulo">Tempo médio de espera por class (Mockado)</h2>
            <p class="card-sub">Dias até cirurgia — antes vs. após priorização</p>
            <div class="tempo-lista" id="tempoLista"></div>
        </div>

        <div class="card-acuracia">
            <h2 class="card-titulo">Indicadores do Pipeline</h2>
            <p class="card-sub">Métricas reais do processamento atual</p>
            <div class="kpi-grid" id="kpiGrid"></div>
            <div class="acuracia-barra-wrap">
                <span class="acuracia-label">Acurácia geral</span>
                <div class="acuracia-trilho">
                    <div class="acuracia-fill" id="acuraciaFill"></div>
                </div>
                <span class="acuracia-valor" id="acuraciaValor"></span>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="./main.js"></script>
</body>

</html>
