<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 80 320 340" width="100%" height="100%">
  <defs>
    <!-- Sombra suave opcional para dar profundidade -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#a35142" flood-opacity="0.15" />
    </filter>

    <!-- Gradiente do guarda-chuva -->
    <linearGradient id="umbrella-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff937e" />
      <stop offset="100%" stop-color="#e26a57" />
    </linearGradient>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- Ondas do Sinal Wi-Fi (Canto superior direito) -->
    <circle cx="323" cy="173" r="10" fill="#e26a57" />
    <path d="M 314 146 A 35 35 0 0 1 354 186" fill="none" stroke="#e26a57" stroke-width="12" stroke-linecap="round" />
    <path d="M 310 118 A 65 65 0 0 1 382 190" fill="none" stroke="#ff8b75" stroke-width="12" stroke-linecap="round" opacity="0.9" />
    <path d="M 310 90 A 95 95 0 0 1 398 178" fill="none" stroke="#ff937e" stroke-width="12" stroke-linecap="round" opacity="0.8" />

    <!-- Topo do Guarda-chuva -->
    <path d="M 250 135 L 250 150" stroke="#d15846" stroke-width="8" stroke-linecap="round" />

    <!-- Cúpula do Guarda-chuva -->
    <path d="M 118 260 C 118 170 180 150 250 150 C 320 150 382 170 382 260 C 352 245 328 245 308 268 C 288 245 262 245 250 248 C 238 245 212 245 192 268 C 172 245 148 245 118 260 Z" fill="url(#umbrella-grad)" stroke="#d15846" stroke-width="8" stroke-linejoin="round" />

    <!-- Brilho/Gomo Interno -->
    <path d="M 180 162 C 150 185 130 220 123 258 C 145 248 170 248 190 265 C 200 230 220 180 250 150 C 205 150 180 162 180 162 Z" fill="#ff9e8a" opacity="0.4" />
    
    <!-- Linhas dos Gomos -->
    <path d="M 250 150 C 215 185 192 225 192 268" fill="none" stroke="#d15846" stroke-width="5" />
    <path d="M 250 150 C 285 185 308 225 308 268" fill="none" stroke="#d15846" stroke-width="5" />

    <!-- Cabo / Estetoscópio -->
    <path d="M 250 245 L 250 355 C 250 385 225 405 195 405 C 165 405 140 380 140 350 L 140 300 C 140 280 155 280 160 280 C 165 280 180 280 180 300 L 180 340 C 180 350 188 358 198 358 C 208 358 215 350 215 340 L 215 280" fill="none" stroke="#d15846" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Olivas do Estetoscópio -->
    <circle cx="160" cy="288" r="7" fill="#d15846" />
    <circle cx="215" cy="288" r="7" fill="#d15846" />

    <!-- Cruz Médica (Lado Direito) -->
    <g fill="#e26a57">
      <rect x="293" y="308" width="40" height="14" rx="4" />
      <rect x="306" y="295" width="14" height="40" rx="4" />
    </g>
  </g>
</svg>