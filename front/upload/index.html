<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Dados - Priorização Cirúrgica</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <img src="/mainIcon.svg" alt="Ícone Principal">
        <ul id="navLinks" style="display:none"></ul>
    </header>

    <main>
        <div class="upload-container">
            <h1>Carregar Dados</h1>
            <p class="subtitulo">Envie os três arquivos CSV para gerar a fila priorizada.</p>

            <form id="formUpload">
                <div class="campo-upload">
                    <label for="fila_cirurgica">Fila Cirúrgica <span class="obrigatorio">*</span></label>
                    <input type="file" id="fila_cirurgica" name="fila_cirurgica" accept=".csv" required>
                </div>

                <div class="campo-upload">
                    <label for="eventos_clinicos">Eventos Clínicos <span class="obrigatorio">*</span></label>
                    <input type="file" id="eventos_clinicos" name="eventos_clinicos" accept=".csv" required>
                </div>

                <div class="campo-upload">
                    <label for="procedimentos">Procedimentos <span class="obrigatorio">*</span></label>
                    <input type="file" id="procedimentos" name="procedimentos" accept=".csv" required>
                </div>

                <button type="submit" id="btnProcessar">Processar Fila</button>
            </form>

            <div id="status" class="status oculto"></div>
        </div>
    </main>

    <script src="./main.js"></script>
</body>

</html>
